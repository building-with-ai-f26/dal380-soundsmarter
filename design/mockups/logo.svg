  <!--
    SoundSmarter logo, v2 (2026-11-15 design session).
    Purple S (Archivo Narrow 700, converted to outlines) on a field of
    yellow and maya blue, split diagonally top right to bottom left.
    The split line runs through both S terminal endings, and each
    terminal is extended then sliced along the line, so the end faces
